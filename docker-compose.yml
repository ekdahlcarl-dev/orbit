services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - orbit-postgres:/var/lib/postgresql/data

volumes:
  orbit-postgres:
